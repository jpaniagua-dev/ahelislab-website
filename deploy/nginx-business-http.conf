# Bootstrap only; replace with HTTPS after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name business.ahelislab.ch;
    root /srv/ahelis-business-website/current/dist-business;
    index index.html;
    charset utf-8;
    include /srv/ahelis-business-website/current/dist-business/nginx-security-headers.conf;
    include /srv/ahelis-business-website/current/dist-business/nginx-redirects.conf;
    location = /nginx-redirects.conf { return 404; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/ahelislab-acme; }
    location = /api/contact { return 503; }
    location ~ /\. { deny all; }
    location = /_headers { return 404; }
    location = /build-info.json { return 404; }
    location = /nginx-security-headers.conf { return 404; }
    location = /404.html { internal; }
    location = /en/404.html { internal; error_page 404 /en/404.html; }
    location /en/ { try_files $uri $uri/ =404; error_page 404 /en/404.html; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}

# Dedicated Business marketing website; the private application stays separate.
# Install after DNS, certificate, build and contact origin configuration exist.
server {
    listen 80;
    listen [::]:80;
    server_name business.ahelislab.ch;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ahelislab-acme; }
    location / { return 301 https://business.ahelislab.ch$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name business.ahelislab.ch;
    ssl_certificate /etc/letsencrypt/live/business.ahelislab.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/business.ahelislab.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /srv/ahelis-business-website/current/dist-business;
    index index.html;
    charset utf-8;
    autoindex off;
    include /srv/ahelis-business-website/current/dist-business/nginx-security-headers.conf;
    location = /api/contact {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4201;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location ~ /\. { deny all; }
    location = /_headers { return 404; }
    location = /build-info.json { return 404; }
    location = /nginx-security-headers.conf { return 404; }
    location = /404.html { internal; }
    location = /en/404.html { internal; error_page 404 /en/404.html; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /en/ { try_files $uri $uri/ =404; error_page 404 /en/404.html; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}

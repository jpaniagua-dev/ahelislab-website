# Static non-indexable preview over HTTPS for both confirmed domains.
# Install only after content, generated security headers and certificates exist.
# Rollback: restore the previous vhost, run nginx -t, then reload Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name ahelis.ch ahelislab.ch;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ahelislab-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ahelis.ch ahelislab.ch;

    ssl_certificate /etc/letsencrypt/live/ahelislab.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahelislab.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/ahelislab-website/current/dist;
    index index.html;
    charset utf-8;
    autoindex off;
    include /srv/ahelislab-website/current/nginx-security-headers.conf;
    include /srv/ahelislab-website/current/dist/nginx-redirects.conf;
    location = /nginx-redirects.conf { return 404; }

    # Install both account snippets before enabling this configuration.
    include /etc/nginx/snippets/ahelis-accounts.conf;

    location = /produits/business/ { return 301 https://business.ahelislab.ch/; }
    location = /en/products/business/ { return 301 https://business.ahelislab.ch/en/; }

    location = /api/contact {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4201;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ahelislab-acme;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location = /_headers {
        return 404;
    }

    location = /build-info.json {
        return 404;
    }

    location = /404.html {
        internal;
    }

    location = /en/404.html {
        internal;
        error_page 404 /en/404.html;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404.html;
    }

    error_page 404 /404.html;
}

# Static non-indexable preview for the confirmed Ahelis domains.
# Install in sites-available; keep disabled until DNS, TLS and content are ready.
# Rollback: remove only this site's sites-enabled symlink and reload after nginx -t.
server {
    listen 80;
    listen [::]:80;
    server_name ahelis.ch ahelislab.ch;

    root /srv/ahelislab-website/current/dist;
    index index.html;
    charset utf-8;
    autoindex off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ahelislab-acme;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404.html;
    }

    error_page 404 /404.html;
}

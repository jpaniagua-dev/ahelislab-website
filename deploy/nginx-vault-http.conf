# Bootstrap ACME without exposing the contact form over plain HTTP.
# Usage: enable only until the dedicated TLS certificate has been issued.
# Rollback: restore the previous vhost, nginx -t, then reload Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name vault.ahelislab.ch;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ahelislab-acme;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 300 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 503;
    }
}

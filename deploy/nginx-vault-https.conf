# Dedicated non-indexable Vault marketing vhost, separate from the application API.
# Install only after DNS, the TLS certificate, a verified build and contact origin configuration exist.
# Rollback: restore the previous vhost and release symlink, nginx -t, then reload Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name vault.ahelislab.ch;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ahelislab-acme; }
    location / { return 301 https://vault.ahelislab.ch$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vault.ahelislab.ch;
    ssl_certificate /etc/letsencrypt/live/vault.ahelislab.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.ahelislab.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /srv/ahelis-vault-website/current/dist-vault;
    index index.html;
    charset utf-8;
    autoindex off;
    include /srv/ahelis-vault-website/current/dist-vault/nginx-security-headers.conf;
    include /srv/ahelis-vault-website/current/dist-vault/nginx-redirects.conf;
    location = /nginx-redirects.conf { return 404; }
    location = /login {
        proxy_pass http://127.0.0.1:4192;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /login/ { return 308 /login$is_args$args; }
    location = /api/contact {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:4201;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location ~ /\. { deny all; }
    location = /_headers { return 404; }
    location = /build-info.json { return 404; }
    location = /nginx-security-headers.conf { return 404; }
    location = /404.html { internal; }
    location = /en/404.html { internal; error_page 404 /en/404.html; }
    location /downloads/ {
        try_files $uri =404;
        include /srv/ahelis-vault-website/current/dist-vault/nginx-security-headers.conf;
        add_header Content-Disposition attachment;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /en/ { try_files $uri $uri/ =404; error_page 404 /en/404.html; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
